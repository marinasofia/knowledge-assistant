[project]
name = "knowledge-assistant"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy", "psycopg[binary]", "alembic", "pydantic-settings", "python-multipart", "authlib", "httpx", "itsdangerous", "anthropic"]

[dependency-groups]
dev = ["pytest", "ruff", "pip-audit"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=6.1.0,<7"]
