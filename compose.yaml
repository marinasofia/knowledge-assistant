services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge_owner
      POSTGRES_PASSWORD: local-owner-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - knowledge-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_owner -d knowledge"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  knowledge-db:
